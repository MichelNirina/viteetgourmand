<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Vite & Gourmand</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="navbar"></div>
    <main>
        <div class="auth-container" style="max-width:500px">
            <h1>Créer un compte</h1>
            <div id="error"   class="error-message"   style="display:none"></div>
            <div id="success" class="success-message" style="display:none"></div>
            <form id="form-register" class="auth-form">
                <input type="text"     name="prenom"    placeholder="Prénom *"                      required>
                <input type="email"    name="email"     placeholder="Email *"                       required>
                <input type="password" name="password"  placeholder="Mot de passe * (10 car. min)"  required minlength="10">
                <input type="tel"      name="telephone" placeholder="Téléphone">
                <input type="text"     name="adresse"   placeholder="Adresse">
                <input type="text"     name="ville"     placeholder="Ville">
                <input type="text"     name="pays"      placeholder="Pays">
                <button type="submit">S'inscrire</button>
            </form>
            <p style="text-align:center"><a href="login.html">Déjà un compte ? Se connecter</a></p>
        </div>
    </main>
    <script src="../js/pages/register.js" type="module"></script>
</body>
</html>
