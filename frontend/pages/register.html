<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Vite & Gourmand</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="navbar"></div>
    <main>
        <h1>Créer un compte</h1>
        <div id="error"   class="error-msg"   style="display:none"></div>
        <div id="success" class="success-msg" style="display:none"></div>
        <form id="form-register">
            <label>Prénom *<br><input type="text" name="prenom" required></label>
            <label>Email *<br><input type="email" name="email" required></label>
            <label>Mot de passe * (10 car. min)<br><input type="password" name="password" required minlength="10"></label>
            <label>Téléphone<br><input type="tel" name="telephone"></label>
            <label>Adresse<br><input type="text" name="adresse"></label>
            <label>Ville<br><input type="text" name="ville"></label>
            <label>Pays<br><input type="text" name="pays"></label>
            <button type="submit">S'inscrire</button>
        </form>
        <p><a href="login.html">Déjà un compte ? Se connecter</a></p>
    </main>
    <script src="../js/pages/register.js" type="module"></script>
</body>
</html>
